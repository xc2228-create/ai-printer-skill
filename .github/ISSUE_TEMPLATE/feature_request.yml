name: 💡 提一个功能建议
description: 希望支持的新格式、新参数、新场景
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你的使用场景
      description: 你在做什么事的时候卡住了？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望的用法
      description: 如果能贴一条理想中的命令更好
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过去的
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 这个建议不会绕过打印机白名单 / 可执行文件拦截 / 页数份数上限
          required: true