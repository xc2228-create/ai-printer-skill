name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src, mcp -Recurse -Filter *.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "syntax error: $($_.FullName)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $bad += "$($_.Name): $($errors[0].Message)" }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: UTF-8 BOM check on .ps1
        shell: pwsh
        run: |
          $missing = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { $missing += $_.Name }
          }
          if ($missing.Count -gt 0) { Write-Error "missing BOM: $($missing -join ', ')"; exit 1 }

      - name: Dry-run smoke (no paper)
        shell: pwsh
        run: |
          node src/print-cli.mjs README.md --printer "Microsoft Print to PDF" --dry-run
